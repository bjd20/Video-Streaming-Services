# Configuration for DOCKER (can be overridden by docker-compose env vars)

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:account_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Use hostname for Docker (container name)
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${HOSTNAME:account-service}