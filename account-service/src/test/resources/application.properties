# Disable Eureka registration during tests — no Eureka server running in CI/test context
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Safe throwaway JWT secret for tests only — never reused elsewhere
jwt.secret=test-only-secret-key-do-not-use-in-any-real-environment-1234567890
jwt.expiration=3600000

# Recreate schema fresh for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false